<ion-content [fullscreen]="true" class="metas-content">
  <!-- Topo da página -->
  <div class="header-container">
    <h1 class="page-title">Metas</h1>
    <img src="../assets/pig-mascot.png" alt="Mascote porco" class="mascot-head" />
  </div>

  <!-- Card: Nova meta -->
  <div class="blob-card new-goal">
    <h2>Nova meta</h2>

    <div class="form-group">
      <label>Meta:</label>
      <div class="custom-input-wrap">
        <input type="text" placeholder="Digite sua meta" [(ngModel)]="novaMeta.nome" />
      </div>
    </div>

    <div class="form-group">
      <label>Valor da meta:</label>
      <div class="custom-input-wrap">
        <input type="number" placeholder="Digite o valor de sua meta" [(ngModel)]="novaMeta.valor" />
      </div>
    </div>

    <!-- Botão de confirmação dentro do card -->
    <div class="btn-container">
      <button class="btn-confirmar" (click)="adicionarMeta()">
        Adicionar meta
      </button>
    </div>
  </div>

  <!-- Lista de Metas Existentes Ordenadas -->
  <div class="blob-card goal-card" *ngFor="let meta of metasOrdenadas">
    <h2>{{ meta.valorAtual >= meta.valorMeta ? 'Meta alcançada' : 'Meta ainda não alcançada' }}</h2>

    <div class="goal-title-row">
      <div class="custom-input-wrap title-pill">
        <span>{{ meta.nome }}</span>
      </div>

      <div class="action-icons">
        <ion-icon 
          [name]="meta.favorita ? 'heart' : 'heart-outline'" 
          [style.color]="meta.favorita ? '#ff4d4d' : '#ffffff'"
          (click)="favoritar(meta)">
        </ion-icon>
        <ion-icon name="remove-circle-outline" (click)="excluirMeta(meta)"></ion-icon>
        <ion-icon
          [name]="meta.valorAtual >= meta.valorMeta ? 'checkbox-outline' : 'square-outline'"
          (click)="marcarConcluida(meta)">
        </ion-icon>
      </div>
    </div>

    <div class="row-value">
      <span class="label-text">Valor da meta:</span>
      <div class="custom-input-wrap value-pill">
        <span>R$ {{ formatarMoeda(meta.valorMeta) }}</span>
      </div>
    </div>

    <div class="row-value">
      <span class="label-text">Valor atual:</span>
      <div class="custom-input-wrap value-pill">
        <span>R$ {{ formatarMoeda(meta.valorAtual) }}</span>
      </div>
    </div>
  </div>
</ion-content>
