<ion-header>
  <ion-toolbar>
    <ion-title>ECOA</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-item lines="none">
    <ion-avatar slot="start">
      <img src="">
    </ion-avatar>
    <ion-label>
      
      <h1>Olá, nome!</h1> <!-- fazer com que o nome da conta apareça aqui-->
      <p>O que você deseja fazer hoje?</p>
    </ion-label>
  </ion-item>

  <ion-card>
    <ion-card-header>
      <ion-card-subtitle>Saldo disponível</ion-card-subtitle>
      <ion-card-title>R$ 1.500,00</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Atualizado hoje ás 12:34  <!-- fazer com que o horário e data apareçam aqui-->
    </ion-card-content>
  <ion-button fill="clear">Ver</ion-button>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Como você está hoje?</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-grid><!-- fazer com que as labels se tornem botões e a resposta seja registrada no banco e adicionada no relatório-->
        <ion-row>
          <ion-col>
            <ion-label>Tristeza</ion-label> <!-- adicionar porquinhos-->
          </ion-col>
          <ion-col>
            <ion-label>Ansiedade</ion-label>
          </ion-col>
          <ion-col>
            <ion-label>Raiva</ion-label>
          </ion-col>
          <ion-col>
            <ion-label>Alegria</ion-label>
          </ion-col>
          <ion-col>
            <ion-label>Tédio</ion-label>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Resumo do mês</ion-card-title>
    </ion-card-header>
    <ion-list>
      <ion-item>
        <ion-label>Gastos fixos</ion-label>
        <ion-note slot="end">R$ 900,00</ion-note>
      </ion-item>
      <ion-item>
        <ion-label>Gastos variáveis</ion-label>
        <ion-note slot="end">R$ 350,00</ion-note>
      </ion-item>
      <ion-item lines="none">
        <ion-label>Gastos extras</ion-label>
        <ion-note slot="end">R$ 120,00</ion-note>
      </ion-item>
    </ion-list>
      <ion-button fill="clear">Ver todos os gastos</ion-button>

  </ion-card>

  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-button expand="block">Gráficos</ion-button>
      </ion-col>
      <ion-col>
        <ion-button expand="block">Falar com IA</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
