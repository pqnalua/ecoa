<ion-header class="ion-no-border" [translucent]="true">
  <ion-toolbar>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="tab2-content" [fullscreen]="true">

  <div class="avatar-wrapper">
    <ion-avatar class="tab2-avatar">
      <img [src]="foto" alt="avatar">
    </ion-avatar>
  </div>

  <ion-list class="menu-list" lines="none">

    <ion-item button detail="true" class="menu-item" (click)="goTo('editarperfil')">
      <ion-icon slot="start" name="person-outline"></ion-icon>
      <ion-label>Editar perfil</ion-label>
    </ion-item>

    <ion-item button detail="true" class="menu-item" (click)="goTo('questionario')">
      <ion-icon slot="start" name="clipboard-outline"></ion-icon>
      <ion-label>
        <h2>Questionário e Hábitos Financeiros</h2>
        <p>Editar renda, dia de pagamento e dependentes</p>
      </ion-label>
    </ion-item>

    <ion-item button detail="true" class="menu-item" (click)="goTo('integracao')">
      <ion-icon slot="start" name="card-outline"></ion-icon>
      <ion-label>Integração Bancária</ion-label>
    </ion-item>

    <ion-item button detail="true" class="menu-item" (click)="goTo('atividades')">
      <ion-icon slot="start" name="bar-chart-outline"></ion-icon>
      <ion-label>Histórico de atividades</ion-label>
    </ion-item>

    <ion-item button detail="true" class="menu-item" (click)="goTo('planos')">
      <ion-icon slot="start" name="ribbon-outline"></ion-icon>
      <ion-label>Planos</ion-label>
    </ion-item>

    <ion-item button detail="true" class="menu-item" (click)="abrirTermos()">
      <ion-icon slot="start" name="shield-checkmark-outline"></ion-icon>
      <ion-label>Termos e Privacidade (LGPD)</ion-label>
    </ion-item>

    <ion-item button detail="true" class="menu-item" (click)="goTo('sobre')">
      <ion-icon slot="start" name="sparkles-outline"></ion-icon>
      <ion-label>Sobre o app</ion-label>
    </ion-item>

    <ion-item button detail="false" class="menu-item delete-item" (click)="confirmarExclusaoConta()">
      <ion-icon slot="start" name="trash-outline"></ion-icon>
      <ion-label>Excluir minha conta</ion-label>
    </ion-item>

    <ion-item button detail="true" class="menu-item logout-item" (click)="logout()">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      <ion-label>Sair</ion-label>
    </ion-item>

  </ion-list>

</ion-content>
